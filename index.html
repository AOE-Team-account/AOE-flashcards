哥萨克深蹲","Man Maker":"男人制造者","Burpee Deadlift":"波比跳硬拉","Squat to Row":"深蹲到划船","Dumbbell Good Morning":"哑铃早安式","Weighted Glute Bridge":"负重臀桥","Push-up to Row":"俯卧撑到划船","Weighted Windmill":"负重风车","Seated Dumbbell Curl":"坐姿哑铃弯举","Seated Dumbbell Press":"坐姿哑铃推举","Seated Lateral Raise":"坐姿侧向抬起","Seated Tricep Extension":"坐姿三头肌伸展","Seated Bent Row":"坐姿屈划船","Seated Hammer Curl":"坐姿锤式弯举","Seated Dumbbell Shrug":"坐姿哑铃耸肩"},"tips":{"Swing your arms and lift your knees to hip height.":"摆动手臂，把膝盖抬到髋部高度。","Make big, slow circles. Keep shoulders away from your ears.":"画大而慢的圈，肩膀远离耳朵。","Reach long overhead and lean sideways, not forward.":"向上伸展并向侧面倾斜，不要向前倾。","Inhale to drop the belly, exhale to round the spine.":"吸气时放松腹部，呼气时圆起脊柱。","Land softly. Step instead of jump for low impact.":"轻柔落地。想降低冲击就改成踏步。","Drive knees to hip height and pump your arms.":"膝盖抬到髋部高度，同时摆动手臂。","Flick heels up toward your glutes, stay light on your feet.":"脚跟快速弹向臀部，脚步保持轻盈。","Leap side to side and sweep the back leg behind you.":"左右跳跃，同时把后腿扫到身后。","Land in a wide squat, hop together, repeat.":"落成宽距深蹲，并拢跳起，重复。","Rotate through your core with every punch.":"每次出拳都用核心带动旋转。","Low-impact. Sway your hips and add arm swings.":"低冲击。摆动臀部并加上摆臂。","Tiny hops on the balls of your feet, wrists turn the rope.":"前脚掌做小幅跳跃，手腕转动跳绳。","Squeeze your side as elbow and knee meet.":"手肘与膝盖相碰时收紧侧腰。","Stay low in a half squat and push off the outside foot.":"保持半蹲姿势，用外侧脚蹬地。","Rise high on your toes, pause, lower slowly.":"用力踮高脚尖，停顿，再缓慢放下。","Step back, drop the back knee, drive through the front heel.":"后撤一步，后膝下沉，前脚跟发力。","Hinge at the hips and squeeze shoulder blades together.":"髋部后移折叠，肩胛骨向中间夹紧。","Hands down, step feet back to plank, step in and stand.":"双手撑地，脚向后踏成平板，再踏回站起。","Chest to floor optional. Jump with arms overhead.":"胸口触地可选。跳起时双臂举过头顶。","Hips low, drive knees to chest quickly.":"臀部放低，快速把膝盖拉向胸口。","Sit back low, explode up, land soft.":"坐低，爆发向上，轻柔落地。","Explode into a star shape, land in a soft squat.":"爆发跳成星形，落成轻柔的深蹲。","Jump and pull knees toward your chest.":"跳起并把膝盖拉向胸口。","Switch legs in the air, land with soft knees.":"在空中换腿，膝盖微屈轻柔落地。","Move from forearms to hands without twisting your hips.":"从小臂撑变成手掌撑，髋部不要扭动。","Press your lower back down and lower legs slowly.":"下背压向地面，缓慢放下双腿。","Keep your body in one line, elbows at 45 degrees.":"身体保持一条直线，手肘与身体呈45度。","Tiny, rapid steps. Stay on the balls of your feet.":"小而快的步伐，保持在前脚掌上。","Curl up, pump arms, inhale 5 counts, exhale 5 counts.":"卷起，摆动手臂，吸气5拍，呼气5拍。","Switch legs smoothly, keep your ribs knitted in.":"平稳换腿，保持肋骨收紧。","Reach long as legs extend, circle arms to hug knees.":"双腿伸直时尽量延伸，手臂画圈抱住膝盖。","Peel up one vertebra at a time, then roll back down.":"一节一节脊椎向上卷起，再慢慢卷回。","Balance on your tailbone, make a V shape with long limbs.":"坐骨尾骨平衡，四肢伸长呈V字。","Press through your heels and squeeze at the top.":"脚跟发力，顶端夹紧。","Keep hips level as one leg lifts.":"一条腿抬起时保持髋部水平。","Lift the top leg with toes forward, lower with control.":"上方腿脚尖朝前抬起，控制着放下。","Top leg bends in front, lift the bottom leg from the inner thigh.":"上方腿屈膝放在前面，用内侧大腿抬起下方腿。","Flutter opposite arm and leg, keep neck long.":"对侧手臂和腿交替小幅摆动，颈部保持放松伸长。","Lift your chest using your back muscles, not your hands.":"用背部肌肉抬起胸口，不要用手撑。","Lift arms and legs together and pulse in small beats.":"手臂和腿同时抬起，小幅脉冲。","Reach forward without letting hips sway.":"向前伸展，髋部不要晃动。","Stack shoulders over wrist, dip and lift your hips.":"肩膀在手腕正上方，髋部下沉再抬起。","Reach opposite arm and leg while keeping hips square.":"对侧手臂和腿同时伸展，髋部保持端正。","Press your heel to the ceiling, hips stay level.":"脚跟向天花板顶，髋部保持水平。","Small fast kicks, keep your low back pressed down.":"小幅快速踢腿，下背压向地面。","Rotate your ribcage and bring elbow toward opposite knee.":"转动胸腔，手肘带向对侧膝盖。","Sit tall and rotate from your ribs, hips stay heavy.":"坐直，从肋骨开始转动，髋部保持沉稳。","Squeeze your glute and lift straight out to the side.":"收紧臀部，向侧面直直抬起。","Sit back like a chair, sweep your arms overhead as you rise.":"像坐椅子一样后坐，起身时双臂扫过头顶。","Elbows high and still, straighten your arms behind you.":"手肘抬高保持不动，向后伸直手臂。","Hips in line with shoulders, lower chest to the floor.":"髋部与肩膀成一线，胸口下降到地面。","Lower opposite arm and leg while your back stays flat.":"对侧手臂和腿放低，背部保持平直。","Nod chin and peel down one bone at a time.":"低头，一节一节脊椎向下卷。","Sink your hips back to your heels and breathe into your back.":"臀部后坐到脚跟，把呼吸送进背部。","Press your hips down and open your chest.":"髋部下压，打开胸口。","Heel to glute, knees together, stand tall.":"脚跟靠向臀部，双膝并拢，站直。","Soft knees, let your head hang heavy.":"膝盖微屈，让头自然下垂。","Hinge from the hips, reach toward your toes.":"从髋部折叠，伸手去够脚尖。","Soles together, sit tall, let knees melt down.":"脚掌相对，坐直，让膝盖自然放松下沉。","Cross ankle over knee and pull the thigh toward you.":"脚踝搭在膝盖上，把大腿拉向自己。","Hug one knee in while the other leg stays long.":"抱住一侧膝盖，另一条腿保持伸长。","Lengthen up on the inhale, twist on the exhale.":"吸气时向上延伸，呼气时扭转。","Reach overhead and arc over to the side.":"向上伸展，再向侧面弯成弧线。","Sink your hips forward and reach tall.":"髋部向前下沉，向上伸展。","Press the floor away and lengthen your spine.":"把地面推远，拉长脊柱。","Keep both hips grounded and reach overhead.":"双髋保持稳固，向上伸展。","Pull the arm across your chest, keep shoulders down.":"把手臂拉过胸前，肩膀下沉。","Elbow to the ceiling, hand down your spine.":"手肘朝向天花板，手沿着脊柱向下。","Clasp your hands behind you and lift them away from your back.":"双手在背后相扣，向远离背部的方向抬起。","Back heel pressed down, hips forward.":"后脚跟压紧，髋部向前。","Fold from the hips with a long spine.":"从髋部折叠，保持脊柱拉长。","Let your ear drop toward your shoulder and breathe.":"让耳朵向肩膀落下，同时呼吸。","Slide into the splits only as far as feels comfortable.":"只滑到感觉舒适的位置，不要勉强劈叉。","Press into hands and feet and lift your chest high.":"用手和脚撑起，把胸口抬高。","Drop to plank, hop back in and stand tall. No push-up, no jump.":"下到平板，跳回站起。不做俯卧撑，不跳。","Chest to floor, press up, hop in and explode into a jump.":"胸口贴地，推起，跳回，爆发向上跳起。","Finish with two quick jumps before you drop down again.":"再次下去之前，快速跳两下收尾。","Shuffle side to side, then drop into a burpee.":"左右滑步，然后下蹲做波比跳。","After the burpee, finish with alternating jump lunges.":"波比跳之后，以交替跳跃弓步收尾。","Throw a jab-cross after you stand up.":"站起后打出直拳加摆拳。","Stand wide, sink into a sumo squat, then burpee.":"站宽，下沉成相扑深蹲，再做波比跳。","Jump and pull your knees up high at the top.":"跳起并在顶端把膝盖拉高。","Jump forward as far as you can, turn around, repeat.":"尽量向前跳远，转身，重复。","Add two quick mountain climbers in the plank.":"在平板中加入两次快速登山。","Finish with a big star jump.":"以一次大幅星形跳收尾。","Lift one leg in the plank. Switch sides each rep.":"平板中抬起一条腿。每次换边。","Elbows under shoulders, one long line from head to heels.":"手肘在肩膀正下方，从头到脚成一条直线。","Hands under shoulders, squeeze glutes and belly.":"双手在肩膀正下方，收紧臀部和腹部。","Stack your hips and lift them high.":"髋部叠起，向上高高抬起。","Lift the top leg while you hold the side plank.":"保持侧平板，同时抬起上方腿。","Hop feet apart and together while your hips stay low.":"双脚跳开再并拢，髋部保持低位。","Drive the knee toward the same elbow, then switch.":"把膝盖带向同侧手肘，然后换边。","Press your hips up with an open chest.":"打开胸口，髋部向上顶起。","Lift hips high, pull belly in, then lower.":"髋部抬高，收紧腹部，再放下。","Tap your shoulder without rocking your hips.":"轻点肩膀，髋部不要晃动。","Knees hover an inch above the floor.":"膝盖悬在离地一指高的位置。","Hover your knees and tap opposite hands.":"膝盖悬空，同时点击对侧的手。","Push up, rotate into a side plank, return.":"推起，转成侧平板，再回到原位。","Hands wider than shoulders to bring in the chest.":"双手比肩更宽，让胸口更多参与。","Hands form a diamond under your chest. Great for triceps.":"双手在胸下组成钻石形。对三头肌很有效。","Elbows hug your ribs on the way down.":"下放时手肘贴着肋骨。","Hips high, lower your head between your hands.":"髋部抬高，头部下降到两手之间。","Bring a knee to the same elbow as you lower.":"下放时把膝盖带向同侧手肘。","Lower, then pulse in small beats near the bottom.":"下放，然后在底部附近做小幅脉冲。","Stand one arm length from a wall and lower your chest to it.":"站在离墙一臂远的位置，把胸口靠向墙壁。","Lift your shoulder blades, keep your neck relaxed.":"抬起肩胛骨，颈部保持放松。","Curl your hips off the floor with your lower abs.":"用下腹把髋部从地面卷起。","Reach your hands to your toes at the top.":"在顶端用手去够脚尖。","Legs straight up, reach your fingertips to your toes.":"双腿向上伸直，指尖去够脚尖。","Lean back and rotate your ribs side to side.":"向后靠，左右转动胸腔。","Reach side to side toward your heels.":"左右伸手去够脚跟。","Cross your legs over each other, low back pressed down.":"双腿交叉互换，下背压向地面。","Sit up tall and reach forward, then roll back down.":"坐直向前伸展，再慢慢卷回。","Ribs down, low back pressed into the floor, arms and legs long.":"肋骨下沉，下背压进地面，手臂和腿伸长。","Hold the hollow shape and rock like a boat.":"保持空心姿势，像船一样摇摆。","Curl up, tabletop legs, hold and breathe.":"卷起，桌面式腿，保持并呼吸。","Lean back, lift your legs and keep your chest proud.":"向后靠，抬起双腿，保持胸口挺起。","Legs straight up, sweep side to side without lifting your shoulders.":"双腿向上伸直，左右扫动，肩膀不要离地。","Lower one foot at a time, keeping your back flat.":"一次放下一只脚，背部保持平直。","Legs straight up, lift your hips slightly with each pulse.":"双腿向上伸直，每次脉冲时微微抬起髋部。","Elbow toward the opposite knee, rotate from the ribs.":"手肘带向对侧膝盖，从肋骨开始转动。","Hands behind you, bend elbows straight back, press up.":"双手撑在身后，手肘向后弯曲，再推起。","Lift arms to shoulder height with soft elbows.":"手臂抬到与肩同高，手肘微屈。","Raise your arms in front to shoulder height.":"向前抬起手臂到肩膀高度。","Squeeze your fists toward your shoulders slowly.":"缓慢地把拳头弯向肩膀并收紧。","Elbows by your ears, straighten your arms overhead.":"手肘靠近耳朵，向头顶伸直手臂。","Arms out to the sides, tiny fast pulses.":"手臂向两侧伸展，做小而快的脉冲。","Sweep your arms from overhead to your hips, chest lifted.":"双臂从头顶扫到髋部，胸口抬起。","Sit back, chest tall, knees track over your toes.":"向后坐，胸口挺起，膝盖对准脚尖。","Stay low and pulse in small beats.":"保持低位，做小幅脉冲。","Wide stance, toes out, drop straight down.":"宽站姿，脚尖外展，垂直下蹲。","Back flat on the wall, thighs parallel to the floor.":"背部平贴墙面，大腿与地面平行。","Step forward, lower until both knees are bent, push back up.":"向前迈步，下蹲到双膝弯曲，再蹬回。","Step wide, sit into one hip, keep the other leg straight.":"迈宽步，坐向一侧髋部，另一条腿保持伸直。","Cross one leg behind you and sink, keep your chest lifted.":"一条腿交叉到身后下沉，胸口保持挺起。","Long stance, drop your back knee straight down.":"拉长步幅，后膝垂直向下。","Shift side to side, sitting deep into one leg.":"左右转移重心，深坐在一条腿上。","Hands behind your head, hinge at the  hands to one side and breathe.":"把双手走向一侧并呼吸。","Forearms down, chest lifted.":"小臂撑地，胸口抬起。","Straight arms, chest lifted, hips down.":"手臂伸直，胸口抬起，髋部下沉。","Hold opposite elbows and sway gently.":"抓住对侧手肘，轻轻摇摆。","Sink into a deep squat with palms together.":"下沉成深蹲，双手合十。","Twist gently and look over your shoulder.":"轻轻扭转并看向肩膀后方。","Sit cross-legged and fold forward.":"盘腿坐下并向前折叠。","Loop a towel over your foot and straighten gently.":"把毛巾套在脚上，轻轻伸直腿。","Circle your ankle both directions.":"向两个方向转动脚踝。","Circle each foot slowly both ways. Great for long flights.":"缓慢地向两个方向转动每只脚。很适合长途飞行。","Point your toes, then pull them back toward you.":"绷起脚尖，然后向自己的方向拉回。","Lift your heels high, lower slowly.":"把脚跟抬高，缓慢放下。","Lift your toes, keep your heels on the floor.":"抬起脚尖，脚跟留在地面。","Pump your arms and march fast.":"摆动手臂，快速行进。","Lift one knee and hold it high, switch.":"抬起一个膝盖并保持高位，然后换边。","Straighten one leg and squeeze your thigh.":"伸直一条腿并收紧大腿。","Straighten one leg then the other.":"先伸直一条腿，再伸直另一条。","Straighten a leg and hold it up.":"伸直一条腿并保持抬起。","Hold both legs out and flutter them.":"双腿向前伸出并快速交替打腿。","Cross one ankle over the other and swap.":"把一只脚踝交叉到另一只上，再互换。","Squeeze your knees together hard, release.":"用力夹紧双膝，然后放松。","Press your knees out against your hands.":"让膝盖向外顶住双手。","Squeeze your glutes tight, hold 3 counts.":"用力收紧臀部，保持3拍。","Hinge forward with a flat back, then sit tall.":"背部平直向前折叠，然后坐直。","Rock your pelvis forward and back.":"让骨盆向前和向后摇动。","Arch and round your spine with your breath.":"随呼吸拱起和圆起脊柱。","Rotate your ribs and look over each shoulder.":"转动胸腔，看向每一侧肩膀后方。","Lean back and pedal your knees.":"向后靠，用膝盖蹬踏。","Lean back a little and lift both feet. Breathe.":"稍微后靠并抬起双脚。保持呼吸。","Pull your knees in as you curl forward.":"向前卷时把膝盖拉进来。","Draw your belly button in and hold.":"把肚脐向内收并保持。","Press your hands up and bring elbows down.":"把双手向上推起，再把手肘带回下方。","Press your palms together hard, release.":"用力压紧手掌，然后放松。","Press your hands down on the armrests.":"双手向下压住扶手。","Curl your fists up and squeeze hard.":"把拳头向上弯起并用力收紧。","Pull your elbows back and squeeze the shoulder blades.":"把手肘向后拉并夹紧肩胛骨。","Reach tall and lengthen your spine.":"向上伸展，拉长脊柱。","Pull your elbows down and in.":"把手肘向下并向内拉。","Lean forward and open your arms wide.":"向前倾，把手臂向两侧打开。","Hands behind you, lift and open your chest.":"双手放在身后，抬起并打开胸口。","Hinge forward and reach toward your toes.":"向前折叠，伸手去够脚尖。","Stand up and sit back down slowly. Only if your seat allows.":"站起，再缓慢坐下。仅在座位允许时进行。","Jab and cross while you stay tall.":"保持身体挺直，打出直拳和摆拳。","Open arms and knees, then close.":"手臂和膝盖打开，然后合上。","Tap your toes quickly, alternating feet.":"快速点击脚尖，双脚交替。","Lift your shoulders to your ears, drop them.":"把肩膀耸向耳朵，然后放下。","Roll your shoulders up, back and down.":"把肩膀向上、向后、向下转动。","Slowly tilt your head side to side.":"缓慢把头向左右倾斜。","Circle both ankles to wake up your legs.":"转动双脚踝，唤醒双腿。","Chin to chest, breathe slowly.":"下巴靠向胸口，缓慢呼吸。","Ear toward shoulder. Switch sides halfway.":"耳朵靠向肩膀。中途换边。","Slowly look over each shoulder.":"缓慢转头看向每一侧肩膀后方。","Pull one arm across your chest.":"把一条手臂拉过胸前。","Elbow by your ear, press it gently back.":"手肘靠近耳朵，轻轻向后压。","Clasp hands behind you, open your chest.":"双手在身后相扣，打开胸口。","Arm out, palm up, pull your fingers back.":"手臂向前，掌心向上，把手指向后拉。","Hug yourself and round your upper back.":"抱住自己，圆起上背。","Hands on your lower back, lift your chest.":"双手放在下背，抬起胸口。","Turn gently and hold the back of your seat.":"轻轻转身，抓住座椅靠背。","Reach one arm overhead and lean away.":"一只手臂举过头顶，向远离的一侧倾斜。","Heel forward, hinge with a flat back.":"脚跟向前，保持背部平直向前折叠。","Ankle on knee, lean forward with a flat back.":"脚踝搭在膝盖上，背部平直向前倾。","Fold over your knees, arms hanging.":"在膝盖上方折叠，手臂自然垂下。","Pull your toes toward you, heel on the floor.":"把脚尖拉向自己，脚跟留在地面。","Sit on the edge, extend one leg back.":"坐在座位边缘，把一条腿向后伸展。","Hop your feet to one side, then the other, in plank.":"在平板中双脚向一侧跳，再向另一侧跳。","Hop your feet to your hands, then back to plank.":"双脚跳向双手，再跳回平板。","Swing your leg forward and back with an opposite arm.":"向前和向后摆腿，同时配合对侧手臂 function zt(t){

/* ================= WORKOUT BUILDER ================= */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const cache={};
function zonesList(){return S.zones.length?S.zones:Object.keys(ZONES)}
const PWRE=/push-up|burpee|jump|sprint|dip|pike|diamond|archer|clap|mountain|v-up|hollow|thruster|swing|snatch|clean|man maker|squat thrust|hop|tuck|hindu|crawl|renegade|deadlift|dumbbell|plank jack/i;
const SCRE=/clamshell|bridge|donkey|hydrant|butterfly|plie|plié|curtsy|kickback|leg lift|side-lying|inner|outer|pulse|prayer|circle|frog|thigh|glute|calf|tiptoe|swimming|teaser|roll|criss|oblique|waist|side bend|arm pulse|barre/i;
X.forEach(e=>{e._pw=!!(e.eq||e.c.includes('hiit')||e.lv>=3||e.tg.includes('burpee')||e.tg.includes('pushup')||PWRE.test(e.n));e._sc=!e._pw&&!!(SCRE.test(e.n)||e.tg.includes('inner')||e.tg.includes('outer')||(e.c[0]==='pilates'&&e.lv<=2))});
const styleW=(e,sty)=>sty==='power'?(e._pw?2.2:1)*(e._sc?.5:1):sty==='sculpt'?(e._sc?2.2:1)*(e._pw?.55:1):1;
const okEq=e=>S.weights||!e.eq;
function pickEx(pool,zone,used,rng,lv,sty){
  let c=pool.filter(e=>e.lv<=lv&&e.z.includes(zone)&&!used.has(e.id));
  if(!c.length)c=pool.filter(e=>e.lv<=lv&&!used.has(e.id));
  if(!c.length)c=pool.filter(e=>e.lv<=lv);
  if(!c.length)c=pool.slice();
  const w=c.map(e=>(1+(e.lv===lv?1:0)+(e.z[0]===zone?1:0))*styleW(e,sty)*(S.weights&&e.eq?2.4:1));let r=rng()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<c.length;i++){r-=w[i];if(r<=0)return c[i]}return c[c.length-1];
}
function buildWorkout(day){
  const seat=!!(S.seat&&S.seat[day]),sty=styleOf();
  const key=[day,zonesList().join(),S.level,S.tix,S.flex,Math.round(kgNow()),seat?'seat':'',sty,S.weights?'w':''].join('|');
  if(cache[key])return cache[key];
  const type=seat?'seat':dayBase(day),lv=S.level,T=TIMES[S.tix].t,wk=Math.floor((day-1)/7)%4;
  const rng=mulberry(hash(key)),Z=zonesList();
  let work=[30,40,45][lv-1]+wk*2,rest=type==='hiit'?[20,20,15][lv-1]:[15,12,10][lv-1];
  if(type==='flow'){work+=5;rest+=3}
  if(type==='pilates'||type==='both')rest=Math.max(8,rest-3);
  if(sty==='power'&&type!=='seat'){work+=6;rest=Math.max(6,rest-3)}
  if(type==='seat'){work=[30,35,40][lv-1]+wk*2;rest=[12,10,8][lv-1]}
  const warmN=T>=30?2:T>=10?1:0;
  const steps=[],used=new Set();
  const warmPool=X.filter(e=>e.c[0]==='warm'&&!!e.seat===seat&&okEq(e));
  const wsel=warmPool.slice().sort(()=>rng()-.5).slice(0,warmN);
  wsel.forEach(e=>{steps.push({ex:e,secs:30,rest:5,warm:true});used.add(e.id)});
  const budget=T*60-warmN*35;
  const n=Math.max(4,Math.round(budget/(work+rest)));
  const catFor=bi=>type==='seat'?'seat':type==='cardio'?'cardio':type==='hiit'?'hiit':(type==='pilates'||type==='flow')?'pilates':(bi%2===0?'cardio':'pilates');
  let specs=[];
  if(n<=12){specs=type==='both'?[{cat:'cardio',k:Math.round(n*.4),rep:1},{cat:'pilates',k:n-Math.round(n*.4),rep:1}]:[{cat:catFor(0),k:n,rep:1}]}
  else{let rem=n,bi=0;while(rem>=4){const k=Math.min(8,Math.ceil(rem/2));specs.push({cat:catFor(bi),k,rep:2});rem-=k*2;bi++}}
  const zOff=Math.floor(rng()*Z.length);let zi=zOff;
  specs.forEach((sp,bi)=>{
    const pool=X.filter(e=>okEq(e)&&e.c[0]!=='warm'&&e.c[0]!=='stretch'&&(sp.cat==='seat'?e.seat:(!e.seat&&e.c.includes(sp.cat)))&&(type!=='flow'||e.lv<=Math.min(lv,2)));
    let list=[];for(let j=0;j<sp.k;j++){const e=pickEx(pool,Z[zi++%Z.length],used,rng,type==='flow'?Math.min(lv,2):lv,sty);used.add(e.id);list.push(e)}
    if(sp.cat==='pilates')list.sort((a,b)=>POSR[a.pos]-POSR[b.pos]);
    for(let r=1;r<=sp.rep;r++)list.forEach(e=>steps.push({ex:e,secs:work,rest,round:r,rounds:sp.rep,block:bi}));
  });
  let total=0;steps.forEach((s,i)=>{total+=s.secs+(i<steps.length-1?s.rest:0)});
  const kc=Math.round(steps.reduce((a,s)=>a+s.secs*metOf(s.ex)*kgNow()/3600,0)*[.9,1,1.1][lv-1]);
  const zs=[...new Set(steps.flatMap(s=>s.ex.z))].filter(z=>Z.includes(z));
  const wo={day,type,title:TI(type).n,steps,total,mins:Math.round(total/60),kcal:kc,zones:Z,covered:zs,work,rest};
  cache[key]=wo;return wo;
}
function buildCool(wo){
  const T=TIMES[S.tix].t,fx=S.flex,sty=styleOf(),seat=wo.type==='seat';
  let n=T<10?3:T<20?4:T<30?5:T<40?6:8;if(wo.type==='flow')n+=2;
  if(sty==='sculpt')n+=1;if(sty==='power')n=Math.max(3,n-2);
  const fxe=sty==='power'?Math.min(fx,2):fx;
  const rng=mulberry(hash('cool'+wo.day+S.flex+S.zones.join()+sty+seat)),Z=zonesList().slice();
  const pool=X.filter(e=>e.c[0]==='stretch'&&e.fx<=fxe&&!!e.seat===seat);
  const used=new Set(),sel=[];let zi=0;
  const gen=['back','glutes','thighs','waist'];
  while(sel.length<n){
    const z=zi<Z.length*2?Z[zi%Z.length]:gen[(zi-Z.length*2)%gen.length];zi++;
    let c=pool.filter(e=>e.z.includes(z)&&!used.has(e.id));
    if(!c.length){if(zi>40)break;continue}
    c.sort((a,b)=>(b.fx===fxe)-(a.fx===fxe)||rng()-.5);
    const e=c[0];used.add(e.id);sel.push(e);
  }
  sel.sort((a,b)=>POSR[a.pos]-POSR[b.pos]);
  const hold=[30,35,45][fx-1]+(wo.type==='flow'?5:0)-(sty==='power'?5:0);
  const steps=sel.map(e=>({ex:e,secs:hold,rest:6}));
  const total=steps.reduce((a,s,i)=>a+s.secs+(i<steps.length-1?s.rest:0),0);
  return {day:wo.day,type:'cool',title:'Cool-down Stretch',steps,total,mins:Math.max(1,Math.round(total/60)),kcal:Math.round(total*MET.stretch*kgNow()/3600)};
}

/* ================= SCREENS ================= */
function nav(){return `<div class="nav">${[['home','🏠','Today'],['plan','📅','Plan'],['medals','🏅','Medals'],['me','👤','Me']].map(([k,e,l])=>`<button class="${tab===k?'on':''}" data-a="tab" data-v="${k}"><span>${e}</span>${l}</button>`).join('')}</div>`}
function render(){
  if(!S.setup){renderOnb();return}
  let b='';
  if(tab==='home')b=homeHTML();if(tab==='plan')b=planHTML();if(tab==='medals')b=medalsHTML();if(tab==='me')b=meHTML();if(tab==='lib')b=libHTML();
  $('#app').innerHTML=b+(tab==='lib'?'':nav());mountAll($('#app'));
}
function zchips(wo){return wo.zones.filter(z=>wo.covered.includes(z)).map(z=>`<span class="chip">${ZONES[z].e} ${ZONES[z].n}</span>`).join('')}
function weekStrip(){
  const st=streaks().days,today=new Date(),dow=(today.getDay()+6)%7,out=[];
  for(let i=0;i<7;i++){const d=new Date(today);d.setDate(d.getDate()-dow+i);const k=ymd(d);out.push(`<div class="wd ${st.includes(k)?'on':''} ${i===dow?'today':''}">${WKD()[i]}<i>${st.includes(k)?'✓':''}</i></div>`)}
  return `<div class="week">${out.join('')}</div>`;
}
function seatCard(day){const on=!!(S.seat&&S.seat[day]);return `<button class="card seatc ${on?'on':''}" data-a="tseat" data-v="${day}"><span class="ic">🪑</span><span style="flex:1"><b>${on?'Seated workout is ON':'Seated workout'}</b><small>${on?'Tap to go back to your normal workout':'Low energy, tired, or on a plane? Tap for a sit-down session'}</small></span><span class="tog ${on?'on':''}" style="display:block;flex:none"></span></button>`}
function homeHTML(){
  const day=nextDay(),wo=buildWorkout(day),t=totals(),hour=new Date().getHours();
  const greet=hour<12?'Good morning':hour<18?'Hello':'Good evening';

let P=null;
function startPlayer(wo,kind,onEnd){
  ensureAudio();
  const steps=[];
  steps.push({k:'ready',secs:5,ex:wo.steps[0].ex,idx:0,total:wo.steps.length});
  wo.steps.forEach((s,i)=>{
    steps.push({k:'work',secs:s.secs,ex:s.ex,idx:i,total:wo.steps.length,round:s.round,rounds:s.rounds,warm:s.warm});
    if(i<wo.steps.length-1)steps.push({k:'rest',secs:s.rest,ex:wo.steps[i+1].ex,idx:i,total:wo.steps.length});
  });
  P={wo,kind,steps,i:-1,left:0,paused:false,last:0,workT:0,kcal:0,onEnd,timer:null};
  P.timer=setInterval(tick,200);
  setStep(0);
}
function setStep(i){
  P.i=i;P.cur=P.steps[i];P.left=P.cur.secs;P.last=performance.now();P.lastSec=null;
  renderPlayer();
  if(P.cur.k==='work'){beep(880,.25);say(P.cur.ex.n)}
  else if(P.cur.k==='rest'){beep(520,.15);say('Rest. Next, '+P.cur.ex.n)}
  else say('Get ready')
}
function advance(){if(P.i+1>=P.steps.length)return endPlayer(true);setStep(P.i+1)}
function tick(){
  if(!P||P.paused)return;const now=performance.now(),dt=(now-P.last)/1000;P.last=now;P.left-=dt;
  if(P.cur.k==='work'){P.workT+=dt;P.kcal+=dt*metOf(P.cur.ex)*kgNow()/3600*[.9,1,1.1][S.level-1]}
  const sec=Math.ceil(P.left);if(sec!==P.lastSec){P.lastSec=sec;if(sec>0&&sec<=3)beep(660,.12);if(P.cur.k==='work'&&sec===Math.floor(P.cur.secs/2)&&P.cur.secs>=30)say('Halfway')}
  if(P.left<=0)advance();else updTimer();
}
function updTimer(){
  const c=document.getElementById('tnum'),r=document.getElementById('tring');if(!c)return;
  c.textContent=Math.ceil(Math.max(0,P.left));
  if(r){const L=2*Math.PI*56;r.setAttribute('stroke-dashoffset',L*(1-Math.max(0,P.left)/P.cur.secs))}
  const pr=document.getElementById('pbar');if(pr){const done=P.steps.slice(0,P.i).reduce((a,s)=>a+s.secs,0)+(P.cur.secs-P.left);const tot=P.steps.reduce((a,s)=>a+s.secs,0);pr.style.width=Math.min(100,done/tot*100)+'%'}
}
function renderPlayer(){
  const c=P.cur,L=2*Math.PI*56,e=c.ex,isRest=c.k==='rest';
  const next=P.steps.slice(P.i+1).find(s=>s.k==='work');
  const label=P.kind==='cool'?`Stretch ${c.idx+1}/${c.total}`:c.k==='ready'?'Get ready':`Move ${c.idx+1}/${c.total}${c.rounds>1?` · Round ${c.round}/${c.rounds}`:''}${c.warm?' · Warm-up':''}`;
  let main='';

  else main=`${figHTML(e.id)}<div class="pname">${e.n}</div><div class="ptip">${e.tip}${P.kind==='cool'&&S.flex===1&&e.m?`<br><span style="color:#2a9d85">Gentle option: ${e.m}</span>`:''}</div><div class="ring"><svg width="128" height="128"><circle cx="64" cy="64" r="56" fill="none" stroke="var(--track)" stroke-width="10"/><circle id="tring" cx="64" cy="64" r="56" fill="none" stroke="var(--pk)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="0"/></svg><b id="tnum">${c.secs}</b></div>`;
  $('#layer').innerHTML=`<div class="player ${isRest?'rest':''}"><div class="ptop"><button class="x" data-a="quitask">✕</button><div class="prog"><i id="pbar" style="width:0"></i></div><span class="sub" style="font-size:12px;white-space:nowrap">${label}</span></div>${main}<div class="ctl"><button data-a="pprev">⏮</button><button class="big" data-a="ppause">${P.paused?'▶':'⏸'}</button><button data-a="pnext">⏭</button></div>${next&&!isRest&&c.k!=='ready'?`<div class="next"><div class="th" data-fig="${next.ex.id}"></div><span><small>NEXT UP</small>${next.ex.n}</span></div>`:''}</div>`;
  mountAll($('#layer'));updTimer();
}
function endPlayer(completed){

function record(wo,secs,kcal,type){
  const now=Date.now(),prev=S.log.filter(l=>l.type!=='cool').map(l=>l.ts);
  if(type!=='cool'){
    const h=new Date(now).getHours();if(h<8)S.flags.early=1;if(h>=21)S.flags.night=1;
    if(prev.length&&dayDiff(ymd(Math.max(...prev)),ymd(now))>=3)S.flags.comeback=1;

    S.done[wo.day]={n:(S.done[wo.day]?S.done[wo.day].n:0)+1,last:now};
  }
  S.log.push({day:wo.day,ts:now,secs:Math.max(30,secs),kcal,type});
  const nm=evalMedals();save();return nm;
}

function confetti(){
  try{const cv=document.createElement('canvas');cv.className='conf';document.body.appendChild(cv);const x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#ff5c7c','#ffc24b','#4fcfb1','#ff8fa6','#8ea2ff'],ps=Array.from({length:90},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3.5,r:3+Math.random()*4,c:cols[Math.floor(Math.random()*5)],a:Math.random()*6}));
  let n=0;(function f(){x.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++n<170)requestAnimationFrame(f);else cv.remove()})()}catch(e){}

/* ================= WEIGHT, ACTIVITY, HEALTH ================= */
const KGLB=2.20462;
const fromKg=kg=>S.wt.unit==='lb'?kg*KGLB:kg;
const toKg=v=>S.wt.unit==='lb'?v/KGLB:v;
const r1=v=>Math.round(v*10)/10;
const fmtW=kg=>r1(fromKg(kg))+' '+S.wt.unit;
const wEntries=()=>S.wt.entries.slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
function kgNow(){const e=wEntries();return e.length?e[e.length-1].kg:60}
function okw(s,unit){const v=parseFloat(String(s).replace(',','.'));if(isNaN(v))return null;const kg=(unit||S.wt.unit)==='lb'?v/KGLB:v;return kg>=25&&kg<=350?kg:null}
function goalReached(){const g=S.wt.goal,s=S.wt.start,e=wEntries();if(g==null||s==null||!e.length||g===s)return false;const c=e[e.length-1].kg;return g<s?c<=g:c>=g}
function logWeight(kg,date){
  const d=date||ymd(Date.now()),i=S.wt.entries.findIndex(e=>e.d===d);
  if(i>=0)S.wt.entries[i].kg=kg;else S.wt.entries.push({d,kg});
  if(S.wt.start==null)S.wt.start=wEntries()[0].kg;
  const nm=evalMedals();save();return nm;
}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
function weightSheet(mode,keep){
  const goal=mode==='goal',e=wEntries();
  const cur=goal?(S.wt.goal!=null?r1(fromKg(S.wt.goal)):''):(e.length?r1(fromKg(e[e.length-1].kg)):'');
  const val=keep!=null?keep:cur;

function wChart(e){
  const pts=e.slice(-30);
  if(pts.length<2)return `<div class="sub" style="margin:10px 0">Log a few more days to see your trend.</div>`;
  const vals=pts.map(p=>fromKg(p.kg));if(S.wt.goal!=null)vals.push(fromKg(S.wt.goal));
  let mn=Math.min(...vals),mx=Math.max(...vals);if(mx-mn<1){mn-=.5;mx+=.5}
  const W=300,H=100,px=i=>8+i*(W-16)/(pts.length-1),py=v=>H-8-(v-mn)/(mx-mn)*(H-16);
  const line=pts.map((p,i)=>px(i).toFixed(1)+','+py(fromKg(p.kg)).toFixed(1)).join(' ');
  const g=S.wt.goal!=null?`<line x1="8" x2="${W-8}" y1="${py(fromKg(S.wt.goal))}" y2="${py(fromKg(S.wt.goal))}" stroke="#4fcfb1" stroke-width="2" stroke-dasharray="5 4"/>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:8px">${g}<polyline points="${line}" fill="none" stroke="var(--pk)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${px(i)}" cy="${py(fromKg(p.kg))}" r="3.5" fill="var(--pk)"/>`).join('')}</svg>${S.wt.goal!=null?'<div class="note">Dashed line = your goal</div>':''}`;
}

    case 'finishdone':$('#layer').innerHTML='';tab='home';planBlock=null;render();window.scrollTo(0,0);break;
    case 'fb':{document.querySelectorAll('#fb button').forEach(b=>b.classList.toggle('on',b===t));const el=$('#fbmsg');
      if(v==='1'&&S.level>1)el.innerHTML=`<button class="btn sm ghost" data-a="lvlchg" data-v="-1" style="margin-bottom:12px">Make it easier next time</button>`;
      else if(v==='-1'&&S.level<3)el.innerHTML=`<button class="btn sm ghost" data-a="lvlchg" data-v="1" style="margin-bottom:12px">Make it harder next time</button>`;
      else el.innerHTML=`<div class="sub" style="margin-bottom:12px">Thanks! We'll keep it steady.</div>`;break}
    case 'lvlchg':{const nl=S.level+(+v);if(nl>S.level)S.flags.lvl=1;S.level=nl;const nm=evalMedals();save();$('#fbmsg').innerHTML=`<div class="sub" style="margin-bottom:12px">Done! Now at ${LEVELS[S.level-1].n}. ${nm.length?'🏅 New medal: '+nm[0].n:''}</div>`;break}
    case 'quitask':{if(P){P.paused=true;figs.forEach(f=>f.paused=true)}confirmBox('Quit workout?','Your progress for this session will not be saved.','Quit','quit');break}
    case 'quit':closeModal();endPlayer(false);break;
    case 'ppause':P.paused=!P.paused;P.userPaused=P.paused;P.last=performance.now();figs.forEach(f=>f.paused=P.paused);document.querySelector('[data-a=ppause]').textContent=P.paused?'▶':'⏸';break;
    case 'pnext':advance();break;
    case 'pprev':{let j=P.i-1;while(j>0&&P.steps[j].k!=='work')j--;setStep(Math.max(0,j));break}
    case 'libmore':libLim+=48;{const y=scrollY;render();scrollTo(0,y)}break;
    case 'libtg':libTg=v;libLim=48;render();break;
    case 'libpos':libPos=v;libLim=48;render();break;
    case 'wlog':weightSheet('log');break;
    case 'wgoal':weightSheet('goal');break;
    case 'wunit':{const [u,m]=v.split('|');S.wt.unit=u;save();weightSheet(m);render();break}
    case 'wsave':{const kg=okw(($('#wv').value||''));if(kg==null){toast('Please enter a valid weight');break}
      const nm=logWeight(kg,$('#wd').value||ymd(Date.now()));closeModal();render();toast('Weight saved ✓');if(nm.length)toastMedal(nm);break}
    case 'wgoalsave':{const kg=okw(($('#wv').value||''));if(kg==null){toast('Please enter a valid weight');break}
      S.wt.goal=kg;if(S.wt.start==null&&S.wt.entries.length)S.wt.start=wEntries()[0].kg;const nm=evalMedals();save();closeModal();render();if(nm.length)toastMedal(nm);break}
    case 'wdel':confirmBox('Delete this entry?','It will be removed from your weight log.','Delete','wdelok',v);break;
    case 'wdelok':S.wt.entries=S.wt.entries.filter(e=>e.d!==v);save();closeModal();render();break;
    case 'act':A={k:v,i:1,mins:'',dist:''};actSheet();break;
    case 'actlv':A.mins=($('#amin')||{value:''}).value;A.dist=($('#adist')||{value:''}).value;A.i=+v;actSheet();break;
    case 'actsave':{const mins=parseFloat(A.mins);if(!(mins>0)){toast('Enter how many minutes');break}
      const a=ACTS.find(x=>x.k===A.k),d=parseFloat(String(A.dist).replace(',','.'));const km=d>0?(S.wt.unit==='lb'?d*1.609:d):0;
      const kcal=actKcal();S.log.push({day:0,ts:Date.now(),secs:Math.round(mins*60),kcal,type:'act',name:a.n,km});
      const nm=evalMedals();save();closeModal();render();toast(a.e+' '+kcal+' kcal logged');if(nm.length)setTimeout(()=>toastMedal(nm),600);break}
    case 'actdel':confirmBox('Delete this activity?','It will be removed from your calories and totals.','Delete','actdelok',v);break;
    case 'actdelok':S.log=S.log.filter(l=>String(l.ts)!==v);save();closeModal();render();break;
    case 'acttimer':{A.mins=($('#amin')||{value:''}).value;closeModal();AT={k:A.k,acc:0,run:true,t0:Date.now()};renderTimer();AT.iv=setInterval(updActTimer,500);break}
    case 'atpause':{if(AT.run){AT.acc+=Date.now()-AT.t0;AT.run=false}else{AT.t0=Date.now();AT.run=true}document.getElementById('atbtn').textContent=AT.run?'⏸':'▶';break}
    case 'atfinish':{const m=Math.max(1,Math.round(elapsedAT()/60000));clearInterval(AT.iv);A.mins=String(m);AT=null;$('#layer').innerHTML='';actSheet();break}
    case 'attcancel':clearInterval(AT.iv);AT=null;$('#layer').innerHTML='';break;
    case 'health':healthSheet();break;
    case 'copyhl':{const ta=$('#hl');ta.select();let ok=false;try{navigator.clipboard.writeText(ta.value).then(()=>{$('#hlmsg').textContent='Copied!'},()=>{$('#hlmsg').textContent='Select the text and copy it manually.'});ok=true}catch(e){}if(!ok)$('#hlmsg').textContent='Select the text and copy it manually.';break}
    case 'obunit':obReadW();ob.unit=v;ob.cur='';ob.goal='';renderOnb();break;
    case 'obskipw':ob.cur='';ob.goal='';ob.step=7;renderOnb();break;
    case 'plus20':P.left+=20;P.cur.secs+=20;updTimer();break;
  }
});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.id==='libq'){libQ=t.value;libLim=48;const l=$('#liblist');if(l){l.innerHTML=libItems();mountAll(l)}}
  if(t.id==='amin'||t.id==='adist'){A.mins=($('#amin')||{value:''}).value;A.dist=($('#adist')||{value:''}).value;const k=$('#akc');if(k)k.innerHTML=actKcal()+' <small style="font-size:14px">kcal</small>'}
});
// closing the quit dialog resumes the workout
new MutationObserver(()=>{if(P&&P.paused&&!$('#modal').innerHTML&&!P.userPaused){P.paused=false;P.last=performance.now();figs.forEach(f=>f.paused=false)}}).observe($('#modal'),{childList:true});
function toastMedal(list){openModal(medalPop(list)+`<button class="btn" data-a="close">Awesome</button>`)}

render();
</script>
</body>
</html>
